version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Expose the application port
    environment:
      DATABASE_URL: postgres://bestappever_user:bestappever_password@db:5432/bestappever_db
      REDIS_URL: redis://redis:6379
      # Add other environment variables for your application here
    depends_on:
      - db
      - redis
    networks:
      - app_network
    # Mount application code for hot-reloading during development
    # Uncomment and adjust if your framework supports it
    # volumes:
    #   - ./app:/app # Example for a Python/Node.js app where code is in 'app' directory

  db:
    image: postgres:15-alpine # Using a lightweight PostgreSQL image
    environment:
      POSTGRES_DB: bestappever_db
      POSTGRES_USER: bestappever_user
      POSTGRES_PASSWORD: bestappever_password
    volumes:
      - db_data:/var/lib/postgresql/data # Persist database data
    ports:
      - "5432:5432" # Expose DB port for local access (e.g., DBeaver, pgAdmin)
    restart: unless-stopped
    networks:
      - app_network

  redis:
    image: redis:7-alpine # Using a lightweight Redis image
    ports:
      - "6379:6379" # Expose Redis port for local access
    restart: unless-stopped
    networks:
      - app_network

volumes:
  db_data: # Volume for PostgreSQL data persistence

networks:
  app_network:
    driver: bridge # Default bridge network for services to communicate